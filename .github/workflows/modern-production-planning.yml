name: Modern Production Planning Stack

on:
  push:
    branches: [main]
    paths:
      - "projects/integrated-lot-sizing-and-scheduling/**"
      - "projects/rolling-horizon-forecast-evolution-production-planning/**"
      - "projects/production-inventory-routing-optimization/**"
      - "projects/energy-carbon-aware-lot-sizing-scheduling/**"
      - "projects/finite-capacity-aps-control-tower/**"
      - ".github/workflows/modern-production-planning.yml"
  pull_request:
    paths:
      - "projects/integrated-lot-sizing-and-scheduling/**"
      - "projects/rolling-horizon-forecast-evolution-production-planning/**"
      - "projects/production-inventory-routing-optimization/**"
      - "projects/energy-carbon-aware-lot-sizing-scheduling/**"
      - "projects/finite-capacity-aps-control-tower/**"
      - ".github/workflows/modern-production-planning.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12"]
        project:
          - integrated-lot-sizing-and-scheduling
          - rolling-horizon-forecast-evolution-production-planning
          - production-inventory-routing-optimization
          - energy-carbon-aware-lot-sizing-scheduling
          - finite-capacity-aps-control-tower
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
